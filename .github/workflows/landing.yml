name: Landing CI

# The marketing site at www.openwork.technology. It builds and deploys
# independently of the app, so it needs its own job; the root CI workflow only
# installs and builds the application at the repository root.
on:
  push:
    branches: [main]
    paths:
      - 'landing/**'
      - '.github/workflows/landing.yml'
  pull_request:
    paths:
      - 'landing/**'
      - '.github/workflows/landing.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: us-east-1
  LANDING_BUCKET: openwork-technology-landing-prod-256309399568
  LANDING_DISTRIBUTION: E1ANKLS7O4YGAE

concurrency:
  group: landing-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Landing site
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: landing
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: landing/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: Configure AWS credentials
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: arn:aws:iam::256309399568:role/OpenWorkLandingGitHubDeployRole
          aws-region: ${{ env.AWS_REGION }}
      - name: Publish landing site
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail

          # Refuse to publish an empty or partial build. `s3 sync --delete` would
          # otherwise mirror the emptiness onto the bucket and take the public
          # site down. A build that "succeeds" while producing nothing is exactly
          # the case set -e cannot catch.
          test -f dist/index.html || { echo 'dist/index.html missing; refusing to publish' >&2; exit 1; }
          asset_count=$(find dist/assets -type f ! -name '*.gz' 2>/dev/null | wc -l | tr -d ' ')
          [ "$asset_count" -ge 2 ] || { echo "only $asset_count assets built; refusing to publish" >&2; exit 1; }
          echo "publishing $asset_count assets"

          # Publish everything except the files handled explicitly below. The
          # .gz siblings are never published under their own names: nothing
          # references them, and they were previously uploaded as
          # Content-Type text/javascript with no Content-Encoding, so requesting
          # one returned gzip bytes labelled as plain JavaScript.
          aws s3 sync dist "s3://${LANDING_BUCKET}" \
            --delete \
            --exclude 'index.html' \
            --exclude '*.gz' \
            --exclude '*.js' \
            --exclude '*.css' \
            --cache-control 'public,max-age=31536000,immutable'

          # Remove objects the exclusions above stop --delete from clearing.
          aws s3 rm "s3://${LANDING_BUCKET}" --recursive \
            --exclude '*' --include '*.gz' --include '*.backup'

          # Serve JS and CSS pre-compressed.
          #
          # CloudFront's automatic compression is enabled on this distribution
          # (Compress: true, CachingOptimized with gzip and brotli) but does not
          # actually compress: a verified cache miss with Accept-Encoding: gzip
          # returned the full 313,600-byte bundle with no Content-Encoding. Rather
          # than depend on it, upload the gzipped bytes under the plain key with
          # Content-Encoding: gzip, which every browser decodes transparently.
          # Uncompressed this build is 442 KB of JS+CSS; compressed it is 115 KB.
          for plain in dist/assets/*.js dist/assets/*.css; do
            [ -e "$plain" ] || continue
            key="assets/$(basename "$plain")"
            case "$plain" in
              *.js)  ctype='text/javascript' ;;
              *.css) ctype='text/css' ;;
            esac
            if [ -e "$plain.gz" ]; then
              aws s3 cp "$plain.gz" "s3://${LANDING_BUCKET}/${key}" \
                --content-type "$ctype" \
                --content-encoding 'gzip' \
                --cache-control 'public,max-age=31536000,immutable'
              echo "published ${key} gzipped ($(wc -c < "$plain.gz" | tr -d ' ') bytes)"
            else
              # No .gz produced: publish uncompressed rather than skip the asset.
              aws s3 cp "$plain" "s3://${LANDING_BUCKET}/${key}" \
                --content-type "$ctype" \
                --cache-control 'public,max-age=31536000,immutable'
              echo "published ${key} uncompressed"
            fi
          done

          aws s3 cp dist/index.html "s3://${LANDING_BUCKET}/index.html" \
            --content-type 'text/html' \
            --cache-control 'no-cache, no-store, must-revalidate'

          invalidation_id=$(aws cloudfront create-invalidation \
            --distribution-id "${LANDING_DISTRIBUTION}" \
            --paths '/*' \
            --query 'Invalidation.Id' \
            --output text)
          aws cloudfront wait invalidation-completed \
            --distribution-id "${LANDING_DISTRIBUTION}" \
            --id "$invalidation_id"
