name: Landing CI

# The marketing site at www.openwork.technology. It builds and deploys
# independently of the app, so it needs its own job; the root CI workflow only
# installs and builds the application at the repository root.
on:
  push:
    branches: [main]
    paths:
      - 'landing/**'
      - '.github/workflows/landing.yml'
  pull_request:
    paths:
      - 'landing/**'
      - '.github/workflows/landing.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: us-east-1
  LANDING_BUCKET: openwork-technology-landing-prod-256309399568
  LANDING_DISTRIBUTION: E1ANKLS7O4YGAE

concurrency:
  group: landing-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Landing site
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: landing
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: landing/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: Configure AWS credentials
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: arn:aws:iam::256309399568:role/OpenWorkLandingGitHubDeployRole
          aws-region: ${{ env.AWS_REGION }}
      - name: Publish landing site
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail

          # Refuse to publish an empty or partial build. `s3 sync --delete` would
          # otherwise mirror the emptiness onto the bucket and take the public
          # site down. A build that "succeeds" while producing nothing is exactly
          # the case set -e cannot catch.
          test -f dist/index.html || { echo 'dist/index.html missing; refusing to publish' >&2; exit 1; }
          asset_count=$(find dist/assets -type f ! -name '*.gz' 2>/dev/null | wc -l | tr -d ' ')
          [ "$asset_count" -ge 2 ] || { echo "only $asset_count assets built; refusing to publish" >&2; exit 1; }
          echo "publishing $asset_count assets"

          # The pre-compressed .gz files are deliberately not published. Nothing
          # references them: index.html points at the uncompressed filenames, and
          # S3 does not negotiate encodings. They were previously uploaded with
          # Content-Type text/javascript and no Content-Encoding, so a request for
          # one returned gzip bytes labelled as plain JavaScript.
          aws s3 sync dist "s3://${LANDING_BUCKET}" \
            --delete \
            --exclude 'index.html' \
            --exclude '*.gz' \
            --cache-control 'public,max-age=31536000,immutable'

          # One-time cleanup of the mislabelled objects already in the bucket.
          # --exclude above stops sync --delete from removing them, because the
          # filter applies to the destination listing too.
          aws s3 rm "s3://${LANDING_BUCKET}" \
            --recursive \
            --exclude '*' \
            --include '*.gz'

          aws s3 cp dist/index.html "s3://${LANDING_BUCKET}/index.html" \
            --content-type 'text/html' \
            --cache-control 'no-cache, no-store, must-revalidate'

          invalidation_id=$(aws cloudfront create-invalidation \
            --distribution-id "${LANDING_DISTRIBUTION}" \
            --paths '/*' \
            --query 'Invalidation.Id' \
            --output text)
          aws cloudfront wait invalidation-completed \
            --distribution-id "${LANDING_DISTRIBUTION}" \
            --id "$invalidation_id"
