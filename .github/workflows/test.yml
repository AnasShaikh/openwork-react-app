name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: contracts-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    strategy:
      fail-fast: true

    name: Foundry project
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.3.5

      - name: Show Forge version
        run: |
          forge --version

      - name: Check maintained tests formatting
        run: forge fmt --check test
        id: fmt

      - name: Build canonical deployed release boundary
        run: forge build script/DeployConfirmedUpgradeArtifacts19Jul2026.s.sol --skip test
        id: build

      - name: Run current mainnet tests
        run: >-
          forge test
          --contracts src/suites/current-mainnet
          --match-path 'test/CurrentMainnet*.t.sol'
          --no-match-path 'test/CurrentMainnetApplicantMilestoneBridges.t.sol'
        id: test

      - name: Run LayerZero bridge harness with compatible compiler
        run: FOUNDRY_PROFILE=layerzero_harness forge test
        id: layerzero-harness
