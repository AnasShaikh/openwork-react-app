name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: contracts-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    strategy:
      fail-fast: true

    name: Foundry project
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.7.1

      - name: Show Forge version
        run: |
          forge --version

      - name: Check maintained tests formatting
        run: forge fmt --check test
        id: fmt

      - name: Build current mainnet contracts
        run: forge build --contracts src/suites/current-mainnet
        id: build

      - name: Run current mainnet tests
        run: forge test --contracts src/suites/current-mainnet --match-path 'test/CurrentMainnet*.t.sol'
        id: test
